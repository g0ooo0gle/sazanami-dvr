name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Goの品質確認
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: sourceを取得
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Go toolchainを準備
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: false

      - name: Go toolchainのversionを確認
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.26.6"

      - name: gofmtを確認
        run: test -z "$(gofmt -l .)"

      - name: 依存fileを確認
        run: go mod verify

      - name: systemd設定を確認
        run: |
          unit=packaging/systemd/sazanami-dvr.service
          env_file=packaging/systemd/sazanami-dvr.env.example
          test -f "$unit"
          test -f "$env_file"
          test -f docs/linux-installation.md
          test "$(grep -c '^ExecStart=' "$unit")" -eq 1
          grep -qx 'Restart=on-failure' "$unit"
          grep -qx 'RestartSec=5s' "$unit"
          grep -qx 'KillSignal=SIGTERM' "$unit"
          grep -qx 'TimeoutStopSec=2min' "$unit"
          grep -qx 'UMask=0077' "$unit"
          ! grep -Eq '^ExecStart(Pre|Post)=' "$unit"
          ! grep -Fq 'db migrate' "$unit"
          grep -qx 'SAZANAMI_CTRLCMD_LISTEN=0.0.0.0:4520' "$env_file"
          grep -qx 'SAZANAMI_RECORDING_HTTP_LISTEN=127.0.0.1:4521' "$env_file"
          grep -qx 'SAZANAMI_WEBUI_LISTEN=127.0.0.1:4522' "$env_file"
          grep -qx 'SAZANAMI_DATA_ROOT=/var/lib/sazanami-dvr' "$env_file"
          grep -qx 'SAZANAMI_CHANNEL_MAP=/var/lib/sazanami-dvr/channels.json' "$env_file"
          data_root=$(sed -n 's/^SAZANAMI_DATA_ROOT=//p' "$env_file")
          channel_map=$(sed -n 's/^SAZANAMI_CHANNEL_MAP=//p' "$env_file")
          test "$(dirname -- "$channel_map")" = "$data_root"
          test "$(grep -c '^SAZANAMI_' "$env_file")" -eq 7
          grep -Fq '${SAZANAMI_CTRLCMD_LISTEN}' "$unit"
          grep -Fq '${SAZANAMI_RECORDING_HTTP_LISTEN}' "$unit"
          grep -Fq '${SAZANAMI_CHANNEL_MAP}' "$unit"
          grep -Fq -- "--channel-map $channel_map" docs/linux-installation.md
          test "$(awk 'index($0, "/etc/sazanami-dvr/channels.json") { count++ } END { print count + 0 }' docs/linux-installation.md)" -eq 1
          test "$(awk '/^## 新しい版へ更新する$/ { update = 1 } /^## 以前の版へ切り戻す$/ { update = 0 } update && index($0, "/etc/sazanami-dvr/channels.json") { count++ } END { print count + 0 }' docs/linux-installation.md)" -eq 1
          ! grep -Fq -- '--max-concurrent-recordings' "$unit"
          ! grep -Fq -- '--max-concurrent-recordings' "$env_file"
          grep -Fx 'ExecStart=' docs/linux-installation.md
          grep -Fq -- '--max-concurrent-recordings 2' docs/linux-installation.md
          grep -Fq 'GET /api/tuners' docs/linux-installation.md
          go build -trimpath -o "$RUNNER_TEMP/sazanami-dvr-systemd-verify" ./cmd/sazanami-dvr
          sudo useradd --system --user-group --home-dir /var/lib/sazanami-dvr --shell /usr/sbin/nologin sazanami-dvr
          sudo install -D -m 0755 "$RUNNER_TEMP/sazanami-dvr-systemd-verify" /usr/local/bin/sazanami-dvr
          sudo install -D -m 0600 "$env_file" /etc/sazanami-dvr/sazanami-dvr.env
          sudo systemd-analyze verify "$unit"

      - name: installer契約を確認
        run: |
          sh packaging/install_test.sh
          sh -n packaging/lifecycle/installer_verify.sh

      - name: unit testを実行
        run: go test -count=1 ./...

      - name: Linux resource smokeを記録
        run: /usr/bin/time -v go test -count=1 ./internal/adapters/sqlite ./internal/app/catalogsync

      - name: test順序への依存を確認
        run: go test -count=1 -shuffle=on ./...

      - name: data raceを確認
        run: go test -count=1 -race -p 1 ./...

      - name: 静的検査を実行
        run: go vet ./...

      - name: 既知の脆弱性を確認
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: 主要環境向けbinaryをbuild
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -o "$RUNNER_TEMP/sazanami-dvr-$os-$arch" ./cmd/sazanami-dvr
          done

  container:
    name: Container構成を確認
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: sourceを取得
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: QEMUを準備
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Buildxを準備
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Compose構成を確認
        run: |
          compose_json="$RUNNER_TEMP/compose.json"
          delete_json="$RUNNER_TEMP/compose-delete.json"
          docker compose --env-file packaging/compose/.env.example \
            -f packaging/compose/compose.yaml config --format json > "$compose_json"
          docker compose --env-file packaging/compose/.env.example \
            -f packaging/compose/compose.yaml -f packaging/compose/compose.konomitv-delete.yaml \
            config --format json > "$delete_json"
          python3 packaging/compose/compose_test.py "$compose_json" "$delete_json"
          sh -n packaging/compose/prepare.sh
          sh packaging/compose/prepare_test.sh
          grep -qx "    edcb_url: 'tcp://127.0.0.1:4520/'" packaging/compose/konomitv.yaml.example
          grep -qx "    port: 7200" packaging/compose/konomitv.yaml.example
          grep -qx "        - '/recordings'" packaging/compose/konomitv.yaml.example

      - name: Sazanami imageを確認
        run: |
          version=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' cmd/sazanami-dvr/main.go)
          test -n "$version"
          image=sazanami-dvr:ci
          docker buildx build --platform linux/amd64 --load \
            --build-arg "VERSION=$version" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag "$image" .
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")" = "$version"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
          test "$(docker run --rm "$image" --version)" = "sazanami-dvr $version"
          docker run --rm --entrypoint /bin/sh "$image" -c \
            'test -r /etc/ssl/certs/ca-certificates.crt && test -r /usr/share/zoneinfo/Asia/Tokyo && test -r /usr/share/licenses/sazanami-dvr/LICENSE'
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$version" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --provenance=false --sbom=false \
            --output "type=oci,dest=$RUNNER_TEMP/sazanami-dvr.oci.tar" .
          tar -tf "$RUNNER_TEMP/sazanami-dvr.oci.tar" | grep -Fx index.json

  lifecycle:
    name: Linux lifecycle確認
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: sourceを取得
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Go toolchainを準備
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: false

      - name: lifecycle scriptを確認
        run: |
          sh packaging/lifecycle/verify_test.sh
          sh packaging/install_test.sh
          sh -n packaging/lifecycle/installer_verify.sh

      - name: candidate archiveを作成
        id: candidate
        run: |
          version=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' cmd/sazanami-dvr/main.go)
          test -n "$version"
          package="sazanami-dvr_${version}_linux_amd64"
          candidate_dir="$RUNNER_TEMP/candidate"
          mkdir -p "$candidate_dir/$package"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.productCommit=$GITHUB_SHA" \
            -o "$candidate_dir/$package/sazanami-dvr" ./cmd/sazanami-dvr
          cp LICENSE README.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$candidate_dir/$package/"
          cp -R docs packaging "$candidate_dir/$package/"
          tar -C "$candidate_dir" -czf "$candidate_dir/$package.tar.gz" "$package"
          printf 'archive=%s\n' "$candidate_dir/$package.tar.gz" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: 公開v0.5.0 archiveを取得
        id: baseline
        run: |
          baseline_dir="$RUNNER_TEMP/baseline"
          mkdir -p "$baseline_dir"
          archive="$baseline_dir/sazanami-dvr_0.5.0_linux_amd64.tar.gz"
          curl --fail --location \
            --output "$archive" \
            https://github.com/g0ooo0gle/sazanami-dvr/releases/download/v0.5.0/sazanami-dvr_0.5.0_linux_amd64.tar.gz
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: 既存resourceを変更前に拒否する
        run: |
          sudo env "PATH=$PATH" packaging/lifecycle/verify.sh --preflight-only

          symlink_target=$(mktemp -d)
          sudo ln -s "$symlink_target" /opt/sazanami-dvr
          if sudo env "PATH=$PATH" packaging/lifecycle/verify.sh --preflight-only; then
            echo "既存symlinkを拒否しませんでした" >&2
            exit 1
          fi
          sudo rm -f -- /opt/sazanami-dvr
          test -d "$symlink_target"
          rmdir "$symlink_target"

          python3 -m http.server --bind 127.0.0.1 4520 >/dev/null 2>&1 &
          listener_pid=$!
          trap 'kill "$listener_pid" 2>/dev/null || true' EXIT
          timeout 5 sh -c 'until ss -H -ltn "sport = :4520" | grep -q .; do sleep 0.1; done'
          if sudo env "PATH=$PATH" packaging/lifecycle/verify.sh --preflight-only; then
            echo "使用中portを拒否しませんでした" >&2
            exit 1
          fi
          kill "$listener_pid"
          wait "$listener_pid" 2>/dev/null || true
          trap - EXIT

          sudo test ! -e /opt/sazanami-dvr
          sudo test ! -e /etc/sazanami-dvr
          sudo test ! -e /var/lib/sazanami-dvr
          ! getent passwd sazanami-dvr
          ! getent group sazanami-dvr

      - name: Fresh Ubuntuで主要lifecycleを確認
        run: |
          sudo env "PATH=$PATH" packaging/lifecycle/verify.sh \
            "${{ steps.baseline.outputs.archive }}" \
            "${{ steps.candidate.outputs.archive }}" \
            "$GITHUB_SHA" \
            "${{ steps.candidate.outputs.version }}"

      - name: Fresh Ubuntuでinstaller lifecycleを確認
        run: |
          # Hosted runnerの一部pathは通常のUbuntuより緩い権限なので、試験対象の標準状態へ戻す。
          sudo chown root:root /opt
          sudo chmod 0755 /opt
          sudo chown root:root /usr/local/bin
          sudo chmod 0755 /usr/local/bin
          sudo env "PATH=$PATH" sh -x packaging/lifecycle/installer_verify.sh \
            "${{ steps.candidate.outputs.archive }}" \
            "${{ steps.candidate.outputs.version }}"
