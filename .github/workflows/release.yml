name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Linux releaseを作成
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: local
    steps:
      - name: sourceを取得
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Go toolchainを準備
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false

      - name: Go toolchainのversionを確認
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.26.5"

      - name: tagと製品versionを照合
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(go run ./cmd/sazanami-dvr --version)" = "sazanami-dvr $version"

      - name: release前testを実行
        run: |
          go mod verify
          go test -count=1 ./...
          go vet ./...

      - name: Linux release archiveを作成
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for arch in amd64 arm64; do
            package="sazanami-dvr_${version}_linux_${arch}"
            mkdir -p "dist/$package"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.productCommit=$GITHUB_SHA" \
              -o "dist/$package/sazanami-dvr" ./cmd/sazanami-dvr
            tar -C dist -czf "dist/$package.tar.gz" "$package"
            rm -r "dist/$package"
          done
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: GitHub Releaseを作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          options=(--verify-tag --generate-notes --title "Sazanami DVR $GITHUB_REF_NAME")
          case "$version" in
            0.*) options+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS "${options[@]}"
