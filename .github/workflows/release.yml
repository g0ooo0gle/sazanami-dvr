name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Linux releaseを作成
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GOTOOLCHAIN: local
    steps:
      - name: sourceを取得
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Go toolchainを準備
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: false

      - name: Go toolchainのversionを確認
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.26.6"

      - name: QEMUを準備
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Buildxを準備
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: tagと製品versionを照合
        run: |
          version=${GITHUB_REF_NAME#v}
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(go run ./cmd/sazanami-dvr --version)" = "sazanami-dvr $version"

      - name: release前testを実行
        run: |
          go mod verify
          go test -count=1 ./...
          go vet ./...

      - name: Linux release archiveを作成
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for arch in amd64 arm64; do
            package="sazanami-dvr_${version}_linux_${arch}"
            mkdir -p "dist/$package"
            binary="dist/$package/sazanami-dvr"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.productCommit=$GITHUB_SHA" \
              -o "$binary" ./cmd/sazanami-dvr
            build_info=$(go version -m "$binary")
            printf '%s\n' "$build_info" | grep -Eq "^[[:space:]]+mod[[:space:]]+github\\.com/g0ooo0gle/sazanami-dvr[[:space:]]+v${version}[[:space:]]*$"
            for required_setting in \
              "vcs.revision=$GITHUB_SHA" \
              "vcs.modified=false" \
              "CGO_ENABLED=0" \
              "GOOS=linux" \
              "GOARCH=$arch"; do
              printf '%s\n' "$build_info" | grep -Fq "$required_setting"
            done
            cp LICENSE README.md THIRD_PARTY_NOTICES.md "dist/$package/"
            cp -R docs packaging "dist/$package/"
            for required_file in sazanami-dvr LICENSE README.md THIRD_PARTY_NOTICES.md \
              docs/linux-installation.md \
              docs/docker-compose.md \
              packaging/systemd/sazanami-dvr.service \
              packaging/systemd/sazanami-dvr.env.example \
              packaging/compose/compose.yaml \
              packaging/compose/compose.konomitv-delete.yaml \
              packaging/compose/.env.example \
              packaging/compose/konomitv.yaml.example \
              packaging/compose/prepare.sh; do
              test -f "dist/$package/$required_file"
            done
            tar -C dist -czf "dist/$package.tar.gz" "$package"
            tar -tzf "dist/$package.tar.gz" > "$RUNNER_TEMP/$package.list"
            for required_file in sazanami-dvr LICENSE README.md THIRD_PARTY_NOTICES.md \
              docs/linux-installation.md \
              docs/docker-compose.md \
              packaging/systemd/sazanami-dvr.service \
              packaging/systemd/sazanami-dvr.env.example \
              packaging/compose/compose.yaml \
              packaging/compose/compose.konomitv-delete.yaml \
              packaging/compose/.env.example \
              packaging/compose/konomitv.yaml.example \
              packaging/compose/prepare.sh; do
              grep -Fx "$package/$required_file" "$RUNNER_TEMP/$package.list"
            done
            rm -r "dist/$package"
          done
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Sazanami OCI imageを公開
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          image="ghcr.io/g0ooo0gle/sazanami-dvr:v$version"
          metadata="$RUNNER_TEMP/image-metadata.json"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$version" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --provenance=mode=max --sbom=true \
            --metadata-file "$metadata" \
            --tag "$image" --push .
          digest=$(python3 - "$metadata" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              print(json.load(source)["containerimage.digest"])
          PY
          )
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s@%s\n' "$image" "$digest" > dist/OCI_IMAGE
          docker buildx imagetools inspect "$image@$digest"

      - name: GitHub Releaseを作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          options=(--verify-tag --generate-notes --title "Sazanami DVR $GITHUB_REF_NAME")
          case "$version" in
            0.*) options+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/OCI_IMAGE "${options[@]}"
